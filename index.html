<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlandata – Monthly Report</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/styles.css">
    <style>
        /* ── Month Navigation ── */
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin: 28px 0 32px;
        }
        .month-nav h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-dark);
            letter-spacing: 0.04em;
            width: 220px;
            text-align: center;
            white-space: nowrap;
        }
        .month-nav button {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 32px;
            height: 32px;
            font-size: 16px;
            cursor: pointer;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.15s, color 0.15s;
        }
        .month-nav button:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* ── Stat Chips ── */
        .stat-chips {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-bottom: 40px;
        }
        .stat-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .stat-chip-value-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }
        .stat-chip-number {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-dark);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 18px;
            min-width: 80px;
            text-align: center;
        }
        .stat-chip-delta {
            font-size: 13px;
            font-weight: 600;
        }
        .stat-chip-delta.up   { color: #2e7d32; }
        .stat-chip-delta.down { color: #c62828; }
        .stat-chip-delta.neutral { color: #888; }
        .stat-chip-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #888;
            font-weight: 600;
        }

        /* ── Section Divider ── */
        .report-divider {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 32px 0;
        }

        /* ── Two-col layout ── */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        /* ── Section Headers ── */
        .report-section-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #888;
            margin-bottom: 16px;
        }

        /* ── Rising / Falling ── */
        .mover-row {
            display: grid;
            grid-template-columns: 200px 1fr;
            align-items: baseline;
            padding: 7px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: var(--text-dark);
        }
        .mover-row:last-child { border-bottom: none; }
        .mover-name { font-weight: 500; }
        .mover-change {
            font-size: 13px;
            color: #888;
            white-space: nowrap;
        }
        .mover-change .arrow {
            font-weight: 700;
            margin-right: 3px;
        }
        .mover-change .arrow.up   { color: #2e7d32; }
        .mover-change .arrow.down { color: #c62828; }

        /* ── Card Debuts ── */
        .debut-row {
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .debut-row:last-child { border-bottom: none; }
        .debut-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
            user-select: none;
        }
        .debut-trigger:hover { color: var(--primary-color); }
        .debut-caret {
            font-size: 10px;
            color: #aaa;
            transition: transform 0.15s;
            display: inline-block;
        }
        .debut-row.open .debut-caret { transform: rotate(90deg); }
        .debut-decks {
            display: none;
            padding: 6px 0 2px 18px;
        }
        .debut-row.open .debut-decks { display: block; }
        .debut-deck-item {
            font-size: 12px;
            color: #888;
            padding: 2px 0;
        }
        .see-more-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 13px;
            cursor: pointer;
            padding: 8px 0 0;
            font-family: Arial, Helvetica, sans-serif;
            text-decoration: underline;
        }
        .see-more-btn:hover { color: var(--primary-hover); }

        /* ── Event Winners ── */
        .winner-row {
            display: grid;
            grid-template-columns: 130px 58px 1fr;
            align-items: baseline;
            gap: 0 8px;
            padding: 7px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: var(--text-dark);
        }
        .winner-row:last-child { border-bottom: none; }
        .winner-name { font-weight: 500; }
        .winner-place {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #888;
        }
        .winner-deck { color: #555; font-size: 13px; }
        .winner-deck a, .debut-deck-item a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .winner-deck a:hover, .debut-deck-item a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="header-placeholder"></div>
        <script src="/header.js"></script>

        <div id="mainContent">

            <!-- Month Navigation -->
            <div class="month-nav">
                <button id="prevMonth" title="Previous month">&#9664;</button>
                <h2 id="monthTitle"></h2>
                <button id="nextMonth" title="Next month">&#9654;</button>
            </div>

            <!-- Stat Chips -->
            <div class="stat-chips" id="statChips"></div>

            <hr class="report-divider">

            <!-- Rising / Falling -->
            <div class="two-col" id="moversSection"></div>

            <hr class="report-divider">

            <!-- Card Debuts + Event Winners -->
            <div class="two-col" id="bottomSection"></div>

        </div><!-- /mainContent -->
    </div><!-- /container -->

    <script>
        const WINNER_PLACEMENTS = new Set(['1st', 'Winner', '1st/2nd', 'Top 2']);
        const DEBUTS_VISIBLE    = 10;
        const WINNERS_VISIBLE   = 10;
        const MONTH_NAMES       = ['January','February','March','April','May','June',
                                   'July','August','September','October','November','December'];

        let reportData  = {};
        let allMonths   = [];
        let currentIdx  = 0;

        const now       = new Date();
        const thisMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

        // ── Helpers ──────────────────────────────────────────────────────

        function formatMonthTitle(key) {
            const [y, m] = key.split('-');
            return `${MONTH_NAMES[parseInt(m) - 1]} ${y}`;
        }

        function deltaHtml(val) {
            if (val === null || val === undefined) return '';
            const sign  = val > 0 ? '+' : '';
            const cls   = val > 0 ? 'up' : val < 0 ? 'down' : 'neutral';
            const minus = val < 0 ? '−' : '';
            return `<span class="stat-chip-delta ${cls}">${val > 0 ? '+' : val < 0 ? '−' : '±'}${Math.abs(val)}</span>`;
        }

        // ── Render ───────────────────────────────────────────────────────

        function renderMonth(idx) {
            const key  = allMonths[idx];
            const data = reportData[key];

            // Title
            document.getElementById('monthTitle').textContent = formatMonthTitle(key);

            // Nav buttons
            document.getElementById('prevMonth').disabled = (idx === 0);
            document.getElementById('nextMonth').disabled = (idx === allMonths.length - 1);

            // Stat chips
            const chips = [
                { value: data.event_count,  delta: data.event_delta,  label: 'Events' },
                { value: data.deck_count,   delta: data.deck_delta,   label: 'Decks'           },
                { value: data.unique_cards, delta: data.unique_delta, label: 'Unique Cards'    },
            ];
            document.getElementById('statChips').innerHTML = chips.map(c => `
                <div class="stat-chip">
                    <div class="stat-chip-value-row">
                        <div class="stat-chip-number">${c.value}</div>
                    </div>
                    <div class="stat-chip-label">${c.label}</div>
                </div>`).join('');

            // Rising / Falling
            const isCurrentMonth = (key === thisMonth);
            if (isCurrentMonth) {
                document.getElementById('moversSection').innerHTML =
                    '<div style="grid-column:1/-1;color:#aaa;font-size:13px;padding:8px 0;">Not enough data — check back when the month is complete.</div>';
            } else {
                function moverRows(list) {
                    if (!list.length) return '<div class="mover-row" style="color:#aaa;font-size:13px;">No data</div>';
                    return list.map(r => `
                        <div class="mover-row">
                            <span class="mover-name">${r.card}</span>
                            <span class="mover-change">
                                <span class="arrow ${r.delta > 0 ? 'up' : 'down'}">${r.delta > 0 ? '▲' : '▼'}</span>
                                ${r.prev_rate.toFixed(1)}% → ${r.curr_rate.toFixed(1)}%
                            </span>
                        </div>`).join('');
                }
                document.getElementById('moversSection').innerHTML = `
                    <div>
                        <div class="report-section-title">Rising</div>
                        ${moverRows(data.rising)}
                    </div>
                    <div>
                        <div class="report-section-title">Falling</div>
                        ${moverRows(data.falling)}
                    </div>`;
            }

            // Card Debuts
            const debuts    = data.debuts || [];
            const visible   = debuts.slice(0, DEBUTS_VISIBLE);
            const hidden    = debuts.slice(DEBUTS_VISIBLE);

            function debutRowHtml(d) {
                const decks = d.decks.map(entry => {
                    const url = entry.id ? `https://moxfield.com/decks/${entry.id}` : null;
                    return url
                        ? `<div class="debut-deck-item"><a href="${url}" target="_blank" rel="noopener">${entry.label}</a></div>`
                        : `<div class="debut-deck-item">${entry.label}</div>`;
                }).join('');
                return `
                    <div class="debut-row">
                        <div class="debut-trigger">
                            <span class="debut-caret">&#9654;</span>
                            ${d.card}
                        </div>
                        <div class="debut-decks">${decks}</div>
                    </div>`;
            }

            let debutsHtml = visible.map(debutRowHtml).join('');
            if (hidden.length) {
                debutsHtml += `<div id="debutExtra" style="display:none">${hidden.map(debutRowHtml).join('')}</div>
                    <button class="see-more-btn" id="seeMoreBtn">Show ${hidden.length} more</button>`;
            }
            if (!debuts.length) {
                debutsHtml = '<div style="color:#aaa;font-size:13px;">No debuts this month</div>';
            }

            // Event Winners
            const winners        = (data.winners || []).filter(w => WINNER_PLACEMENTS.has(w.placement));
            const winnersVisible = winners.slice(0, WINNERS_VISIBLE);
            const winnersHidden  = winners.slice(WINNERS_VISIBLE);

            function winnerRowHtml(w) {
                return `<div class="winner-row">
                    <span class="winner-name">${w.winner_name || '—'}</span>
                    <span class="winner-place">${w.placement === 'Winner' ? '1st' : w.placement}</span>
                    <span class="winner-deck">${w.id ? `<a href="https://moxfield.com/decks/${w.id}" target="_blank" rel="noopener">${w.deck_name}</a>` : w.deck_name} – ${w.date}</span>
                </div>`;
            }

            let winnersHtml = winnersVisible.map(winnerRowHtml).join('');
            if (winnersHidden.length) {
                winnersHtml += `<div id="winnersExtra" style="display:none">${winnersHidden.map(winnerRowHtml).join('')}</div>
                    <button class="see-more-btn" id="seeMoreWinnersBtn">Show ${winnersHidden.length} more</button>`;
            }
            if (!winners.length) {
                winnersHtml = '<div style="color:#aaa;font-size:13px;">No results recorded</div>';
            }

            document.getElementById('bottomSection').innerHTML = `
                <div>
                    <div class="report-section-title">Card Debuts</div>
                    ${debutsHtml}
                </div>
                <div>
                    <div class="report-section-title">Event Winners</div>
                    ${winnersHtml}
                </div>`;

            // Wire up winners see more
            const seeMoreWinnersBtn = document.getElementById('seeMoreWinnersBtn');
            if (seeMoreWinnersBtn) {
                const extra = document.getElementById('winnersExtra');
                seeMoreWinnersBtn.addEventListener('click', () => {
                    const isHidden = extra.style.display === 'none';
                    extra.style.display = isHidden ? 'block' : 'none';
                    seeMoreWinnersBtn.textContent = isHidden ? 'Show less' : `Show ${winnersHidden.length} more`;
                });
            }

            // Wire up debut expand/collapse
            document.querySelectorAll('.debut-trigger').forEach(trigger => {
                trigger.addEventListener('click', () => {
                    trigger.closest('.debut-row').classList.toggle('open');
                });
            });

            // Wire up see more
            const seeMoreBtn = document.getElementById('seeMoreBtn');
            if (seeMoreBtn) {
                const extra = document.getElementById('debutExtra');
                seeMoreBtn.addEventListener('click', () => {
                    const isHidden = extra.style.display === 'none';
                    extra.style.display = isHidden ? 'block' : 'none';
                    seeMoreBtn.textContent = isHidden ? 'Show less' : `Show ${hidden.length} more`;
                });
            }
        }

        // ── Navigation ───────────────────────────────────────────────────

        document.getElementById('prevMonth').addEventListener('click', () => {
            if (currentIdx > 0) { currentIdx--; renderMonth(currentIdx); }
        });
        document.getElementById('nextMonth').addEventListener('click', () => {
            if (currentIdx < allMonths.length - 1) { currentIdx++; renderMonth(currentIdx); }
        });

        // ── Init ─────────────────────────────────────────────────────────

        fetch('/data/monthly_report.json')
            .then(r => r.json())
            .then(data => {
                reportData = data;

                // Limit to Jan 2024 through last complete month
                allMonths = Object.keys(data).sort().filter(m => m >= '2024-01' && m <= thisMonth);

                const lastComplete = allMonths.filter(m => m < thisMonth);
                currentIdx = lastComplete.length > 0
                    ? allMonths.indexOf(lastComplete[lastComplete.length - 1])
                    : allMonths.length - 1;

                renderMonth(currentIdx);
            })
            .catch(err => {
                document.getElementById('mainContent').innerHTML =
                    '<p style="color:#c62828;padding:40px 0;">Failed to load report data.</p>';
                console.error(err);
            });
    </script>
</body>
</html>
